apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "smartintern.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "smartintern.selectorLabels" (dict "root" . "name" "smartintern-frontend" "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
{{- if .Values.apps.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "smartintern.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "smartintern.selectorLabels" (dict "root" . "name" "smartintern-frontend" "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smartintern.selectorLabels" (dict "root" . "name" "smartintern-frontend" "component" "frontend") | nindent 8 }}
        app.kubernetes.io/part-of: smartintern-ai
      annotations:
        smartintern.ai/image-tag: {{ include "smartintern.imageTag" . | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ include "smartintern.imageTag" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          startupProbe:
            httpGet: {path: /health, port: http}
            {{- toYaml .Values.frontend.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            {{- toYaml .Values.frontend.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: {path: /health, port: http}
            {{- toYaml .Values.frontend.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
