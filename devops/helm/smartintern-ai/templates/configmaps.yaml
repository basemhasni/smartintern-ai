apiVersion: v1
kind: ConfigMap
metadata:
  name: smartintern-backend-config
  labels:
    {{- include "smartintern.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  NODE_ENV: {{ .Values.backendConfig.nodeEnv | quote }}
  PORT: {{ .Values.backend.service.port | quote }}
  AI_SERVICE_URL: {{ .Values.backendConfig.aiServiceUrl | quote }}
  AI_SERVICE_TIMEOUT_MS: {{ .Values.backendConfig.aiServiceTimeoutMs | quote }}
  AI_SERVICE_HEALTH_TIMEOUT_MS: {{ .Values.backendConfig.aiServiceHealthTimeoutMs | quote }}
  AI_MATCHING_TIMEOUT_MS: {{ .Values.backendConfig.aiMatchingTimeoutMs | quote }}
  AI_SKILL_GAP_TIMEOUT_MS: {{ .Values.backendConfig.aiSkillGapTimeoutMs | quote }}
  AI_GENERATION_TIMEOUT_MS: {{ .Values.backendConfig.aiGenerationTimeoutMs | quote }}
  AI_RAG_TIMEOUT_MS: {{ .Values.backendConfig.aiRagTimeoutMs | quote }}
  FRONTEND_URL: {{ .Values.backendConfig.frontendUrl | quote }}
  CORS_ORIGIN: {{ .Values.backendConfig.corsOrigin | quote }}
  JSON_BODY_LIMIT: {{ .Values.backendConfig.jsonBodyLimit | quote }}
  AUTH_RATE_LIMIT_WINDOW_MS: {{ .Values.backendConfig.authRateLimitWindowMs | quote }}
  AUTH_RATE_LIMIT_MAX: {{ .Values.backendConfig.authRateLimitMax | quote }}
  AUTH_COOKIE_NAME: {{ .Values.backendConfig.authCookieName | quote }}
  AUTH_COOKIE_MAX_AGE_MS: {{ .Values.backendConfig.authCookieMaxAgeMs | quote }}
  AUTH_COOKIE_SAME_SITE: {{ .Values.backendConfig.authCookieSameSite | quote }}
  AUTH_COOKIE_SECURE: {{ .Values.backendConfig.authCookieSecure | quote }}
  CSRF_COOKIE_NAME: {{ .Values.backendConfig.csrfCookieName | quote }}
  CSRF_HEADER_NAME: {{ .Values.backendConfig.csrfHeaderName | quote }}
  CSRF_COOKIE_MAX_AGE_MS: {{ .Values.backendConfig.csrfCookieMaxAgeMs | quote }}
  CSRF_COOKIE_SAME_SITE: {{ .Values.backendConfig.csrfCookieSameSite | quote }}
  CSRF_COOKIE_SECURE: {{ .Values.backendConfig.csrfCookieSecure | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartintern-ai-config
  labels:
    {{- include "smartintern.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
data:
  APP_NAME: {{ .Values.aiConfig.appName | quote }}
  APP_ENV: {{ .Values.aiConfig.appEnv | quote }}
  PORT: {{ .Values.ai.service.port | quote }}
  ALLOWED_ORIGINS: {{ .Values.aiConfig.allowedOrigins | quote }}
  SMARTINTERN_SENTENCE_MODEL: {{ .Values.aiConfig.sentenceModel | quote }}
  SMARTINTERN_ALLOW_MODEL_DOWNLOAD: {{ .Values.aiConfig.allowModelDownload | quote }}
  RAG_ALLOW_MODEL_DOWNLOAD: {{ .Values.aiConfig.ragAllowModelDownload | quote }}
