apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "smartintern.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    {{- include "smartintern.selectorLabels" (dict "root" . "name" "smartintern-postgres" "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
