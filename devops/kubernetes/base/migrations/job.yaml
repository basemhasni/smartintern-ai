apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    app.kubernetes.io/name: smartintern-backend-migrate
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: smartintern-ai
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartintern-backend-migrate
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: smartintern-ai
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: bessem785/smartintern-backend-migrate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartintern-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
