# Run with: docker compose -p smartintern-step10-validation --env-file .env.ci.example
#   -f compose.yaml -f devops/release/compose.validation.yaml run --rm SERVICE
# Separate dependency volumes avoid installing Linux packages on the Windows host.
services:
  frontend-tests:
    profiles: [validation]
    image: node:22.23.4-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./frontend-web:/workspace
      - frontend-test-deps:/workspace/node_modules
    command: sh -ec 'npm ci --no-audit; npm run test:coverage; npm run build; npm audit --audit-level=critical'
  backend-tests:
    profiles: [validation]
    image: node:22.23.4-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./backend-api:/workspace
      - backend-test-deps:/workspace/node_modules
    command: sh -ec 'apt-get update -qq; apt-get install -y --no-install-recommends openssl >/dev/null; npm ci --no-audit; npx --no-install prisma generate; npm run test:coverage; npm audit --audit-level=critical'
  ai-tests:
    profiles: [validation]
    image: smartintern-ai:${IMAGE_TAG:-latest}
    user: root
    working_dir: /workspace
    volumes:
      - ./ai-service:/workspace
    environment:
      SMARTINTERN_ALLOW_MODEL_DOWNLOAD: 'false'
      RAG_ALLOW_MODEL_DOWNLOAD: 'false'
    command: sh -ec 'python -m pip install coverage==7.10.7; python -m coverage run --branch --source=app -m unittest discover -s tests; python -m coverage xml; python -m coverage report --skip-covered'
  mobile-checks:
    profiles: [validation]
    image: node:22.23.4-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./mobile-app:/workspace
      - mobile-test-deps:/workspace/node_modules
    command: sh -ec 'npm ci --no-audit; npm run lint; npm run typecheck; npm run test:logic; npx --yes expo-doctor@1.20.1 .; npm audit --audit-level=critical'
  e2e-tests:
    profiles: [validation]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace
    init: true
    ipc: host
    volumes:
      - ./frontend-web:/workspace
      - frontend-test-deps:/workspace/node_modules
    environment:
      CI: 'true'
      E2E_BASE_URL: http://frontend:8080
    networks: [smartintern-network]
    command: sh -ec 'npm ci --no-audit; npm run test:e2e'
  mobile-smoke:
    profiles: [validation]
    image: smartintern-backend-migrate:${IMAGE_TAG:-latest}
    working_dir: /workspace/mobile-app
    volumes:
      - .:/workspace
      - backend-test-deps:/workspace/backend-api/node_modules
    environment:
      TEST_API_URL: http://backend:5000/api
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks: [smartintern-network]
    command: node scripts/student-flow-smoke.cjs
  performance:
    profiles: [validation]
    image: grafana/k6:0.55.2
    volumes:
      - ./devops/release/performance:/scripts:ro
      - ./artifacts/validation:/reports
    networks: [smartintern-network]
    command: run --summary-export /reports/performance-compose.json /scripts/smoke.js
  security-filesystem:
    profiles: [validation]
    image: smartintern-release-tools:local
    working_dir: /workspace
    entrypoint: sh
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: -ec 'bash devops/release/scripts/scan-filesystem.sh'
  release-tools:
    profiles: [validation]
    image: smartintern-release-tools:local
    build:
      context: ./devops/release
      dockerfile: Dockerfile.tools
    working_dir: /workspace
    entrypoint: sh
    networks: [minikube-tools]
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: -ec 'apk add --no-cache bash; bash devops/release/scripts/scan-images.sh latest'
volumes:
  frontend-test-deps:
  backend-test-deps:
  mobile-test-deps:
networks:
  minikube-tools:
    external: true
    name: minikube
